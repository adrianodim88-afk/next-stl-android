plugins { id 'com.android.application' }
android {
    namespace 'com.adrianodim.controle'
    compileSdk 34
    defaultConfig {
        applicationId "com.adrianodim.controle"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file('keystore/controle.jks')
            storePassword 'controle'
            keyAlias 'controle'
            keyPassword 'controle'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { }
