plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adrianodim.nextstl'
    compileSdk 34

    defaultConfig {
        applicationId "com.adrianodim.nextstl"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            storeFile file('keystore/next.jks')
            storePassword 'nextstl'
            keyAlias 'next'
            keyPassword 'nextstl'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
